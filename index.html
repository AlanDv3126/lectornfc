<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <title>NFC Master - Pro Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            color: #fff;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Animated background */
        .bg-stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(30, 64, 175, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(6, 182, 212, 0.15) 0%, transparent 50%),
                #000000;
            pointer-events: none;
            z-index: 0;
        }

        .wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
        }

        /* Header con título */
        .header {
            text-align: center;
            padding: 2rem 1rem 1rem;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.8) 0%, rgba(0, 0, 0, 0) 100%);
        }

        h1 {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #1e40af 0%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            letter-spacing: -2px;
            text-shadow: 0 0 40px rgba(30, 64, 175, 0.5);
        }

        .subtitle {
            font-size: 0.875rem;
            color: #94a3b8;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .status {
            display: inline-block;
            padding: 0.6rem 1.5rem;
            border-radius: 50px;
            font-size: 0.875rem;
            font-weight: 700;
            border: 2px solid;
            animation: pulse-glow 2s ease-in-out infinite;
        }

        .status.ready {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border-color: #10b981;
        }

        .status.error {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border-color: #ef4444;
        }

        @keyframes pulse-glow {
            0%, 100% { 
                box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
            }
            50% { 
                box-shadow: 0 0 30px rgba(16, 185, 129, 0.8);
            }
        }

        /* Canvas 3D */
        #canvas-3d {
            width: 100%;
            height: 350px;
            display: block;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.3) 0%, rgba(20, 30, 48, 0.3) 100%);
            border-bottom: 2px solid rgba(30, 64, 175, 0.3);
        }

        /* Main content */
        .content {
            flex: 1;
            padding: 2rem 1rem;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .alert {
            padding: 1.2rem;
            border-radius: 1rem;
            margin-bottom: 2rem;
            font-size: 0.875rem;
            line-height: 1.6;
            border-left: 5px solid;
            backdrop-filter: blur(10px);
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert.info {
            background: rgba(30, 64, 175, 0.2);
            border-color: #1e40af;
            color: #93c5fd;
        }

        .alert.error {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
            color: #fca5a5;
        }

        .section {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.7) 0%, rgba(20, 30, 48, 0.7) 100%);
            border-radius: 1.2rem;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 2px solid rgba(30, 64, 175, 0.3);
            backdrop-filter: blur(10px);
            animation: fadeInUp 0.7s ease-out;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            padding-bottom: 1rem;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 50px;
            height: 4px;
            background: linear-gradient(90deg, #1e40af, #06b6d4);
            border-radius: 2px;
            box-shadow: 0 0 20px rgba(30, 64, 175, 0.6);
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
            margin-bottom: 1.5rem;
        }

        button {
            padding: 1.2rem;
            border: none;
            border-radius: 0.8rem;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            position: relative;
            overflow: hidden;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            font-size: 1rem;
            box-shadow: 0 0 30px rgba(30, 64, 175, 0.4);
            border: 2px solid rgba(30, 64, 175, 0.5);
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.3);
            transition: left 0.6s ease;
            z-index: 0;
        }

        button:hover::before {
            left: 100%;
        }

        button > * {
            position: relative;
            z-index: 1;
        }

        button:hover:not(:disabled) {
            transform: translateY(-4px);
            box-shadow: 0 10px 50px rgba(30, 64, 175, 0.8);
        }

        button:active:not(:disabled) {
            transform: scale(0.92);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);
            color: white;
            grid-column: span 2;
        }

        .btn-primary.active {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            box-shadow: 0 0 50px rgba(245, 158, 11, 0.8);
            border-color: #f59e0b;
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border-color: rgba(16, 185, 129, 0.5);
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.4);
        }

        .btn-success:hover:not(:disabled) {
            box-shadow: 0 10px 50px rgba(16, 185, 129, 0.8);
        }

        .btn-success.active {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            box-shadow: 0 0 50px rgba(245, 158, 11, 0.8);
            border-color: #f59e0b;
        }

        .spinner {
            width: 1.4rem;
            height: 1.4rem;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 700;
            color: #cbd5e1;
            margin-bottom: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input, select, textarea {
            width: 100%;
            padding: 1rem;
            border: 2px solid rgba(30, 64, 175, 0.3);
            border-radius: 0.6rem;
            font-size: 1rem;
            font-family: inherit;
            background: rgba(15, 23, 42, 0.6);
            color: #fff;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #1e40af;
            box-shadow: 0 0 0 4px rgba(30, 64, 175, 0.3), inset 0 0 15px rgba(30, 64, 175, 0.1);
            background: rgba(15, 23, 42, 0.8);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .result-box {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15) 0%, rgba(6, 182, 212, 0.15) 100%);
            border: 2px solid rgba(16, 185, 129, 0.4);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-top: 1.5rem;
            display: none;
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .result-box.show {
            display: block;
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.7) rotateX(20deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotateX(0);
            }
        }

        .result-item {
            background: rgba(15, 23, 42, 0.9);
            padding: 1.2rem;
            border-radius: 0.6rem;
            border-left: 4px solid #06b6d4;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            animation: slideInLeft 0.5s ease-out;
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .result-item:last-child {
            margin-bottom: 0;
        }

        .result-label {
            font-size: 0.75rem;
            font-weight: 800;
            color: #06b6d4;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 0.6rem;
        }

        .result-value {
            color: #e2e8f0;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .result-link {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .result-link:hover {
            color: #93c5fd;
            text-decoration: underline;
        }

        .capacity-info {
            background: linear-gradient(135deg, rgba(30, 64, 175, 0.2) 0%, rgba(6, 182, 212, 0.2) 100%);
            border: 2px solid rgba(30, 64, 175, 0.4);
            border-radius: 0.8rem;
            padding: 1.2rem;
            font-size: 0.875rem;
            color: #93c5fd;
            margin-top: 1.2rem;
            display: none;
            animation: slideUp 0.6s ease-out;
            font-weight: 600;
            line-height: 1.8;
        }

        .capacity-info.show {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 2000;
            max-width: 400px;
        }

        .toast {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.98) 0%, rgba(20, 30, 48, 0.98) 100%);
            border: 2px solid;
            border-radius: 1rem;
            padding: 1.2rem;
            margin-bottom: 1rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(30, 64, 175, 0.4);
            animation: slideInRight 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-left: 5px solid #3b82f6;
            backdrop-filter: blur(10px);
            font-weight: 600;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(500px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .toast.error {
            border-left-color: #ef4444;
        }

        .toast.success {
            border-left-color: #10b981;
        }

        @media (max-width: 640px) {
            h1 {
                font-size: 2rem;
            }

            .buttons {
                grid-template-columns: 1fr;
            }

            .btn-primary {
                grid-column: span 1;
            }

            #canvas-3d {
                height: 280px;
            }

            .toast-container {
                left: 1rem;
                right: 1rem;
                bottom: 1rem;
                max-width: none;
            }

            button {
                font-size: 0.9rem;
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-stars"></div>

    <div class="wrapper">
        <div class="header">
            <h1>NFC MASTER</h1>
            <p class="subtitle">Pro Edition</p>
            <div class="status" id="status">Verificando...</div>
        </div>

        <canvas id="canvas-3d"></canvas>

        <div class="content">
            <div id="alerts-container"></div>

            <!-- SCAN Section -->
            <div class="section">
                <div class="section-title">📡 Lectura</div>
                <div class="buttons">
                    <button class="btn-primary" id="btn-scan">
                        <span>🔍 SCAN</span>
                    </button>
                </div>
                <div class="result-box" id="read-output"></div>
                <div class="capacity-info" id="capacity-info"></div>
            </div>

            <!-- WRITE Section -->
            <div class="section">
                <div class="section-title">✍️ Escritura</div>
                <div class="form-group">
                    <label for="write-type">Tipo</label>
                    <select id="write-type">
                        <option value="text">📝 Texto</option>
                        <option value="url">🔗 URL</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="write-content">Contenido</label>
                    <textarea id="write-content" placeholder="Escribe aquí..."></textarea>
                </div>
                <button class="btn-success" id="btn-write">
                    <span>✨ WRITE</span>
                </button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script>
        // Toast notifications
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<strong>${message}</strong>`;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideInRight 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) reverse';
                setTimeout(() => toast.remove(), 500);
            }, 4000);
        }

        // Three.js 3D NFC Tag
        let scene, camera, renderer, tag;

        function initThreeJS() {
            const canvas = document.getElementById('canvas-3d');
            const width = canvas.clientWidth;
            const height = canvas.clientHeight;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.Fog(0x0f172a, 100, 1000);

            camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
            camera.position.z = 3.5;

            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
            renderer.setSize(width, height);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffffff, 1.2);
            pointLight.position.set(8, 8, 8);
            pointLight.castShadow = true;
            scene.add(pointLight);

            const pointLight2 = new THREE.PointLight(0x06b6d4, 0.8);
            pointLight2.position.set(-8, -8, 8);
            scene.add(pointLight2);

            const pointLight3 = new THREE.PointLight(0xf59e0b, 0.6);
            pointLight3.position.set(0, 0, 10);
            scene.add(pointLight3);

            // Create NFC Tag (3D Box with details)
            const geometry = new THREE.BoxGeometry(1.8, 2.5, 0.12);
            const material = new THREE.MeshStandardMaterial({
                color: 0xfbbf24,
                metalness: 0.85,
                roughness: 0.15,
                emissive: 0xf59e0b,
                emissiveIntensity: 0.4,
                envMapIntensity: 1
            });
            tag = new THREE.Mesh(geometry, material);
            tag.castShadow = true;
            tag.receiveShadow = true;
            scene.add(tag);

            // Add glow effect
            const glowGeometry = new THREE.BoxGeometry(1.85, 2.55, 0.2);
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: 0xf59e0b,
                transparent: true,
                opacity: 0.15
            });
            const glow = new THREE.Mesh(glowGeometry, glowMaterial);
            tag.add(glow);

            // Animation loop
            function animate() {
                requestAnimationFrame(animate);
                
                // Smooth rotation
                tag.rotation.y += 0.006;
                tag.rotation.x += 0.002;
                
                // Subtle floating effect
                tag.position.y = Math.sin(Date.now() * 0.001) * 0.3;
                
                renderer.render(scene, camera);
            }
            animate();

            // Handle window resize
            window.addEventListener('resize', () => {
                const newWidth = canvas.clientWidth;
                const newHeight = canvas.clientHeight;
                camera.aspect = newWidth / newHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(newWidth, newHeight);
            });
        }

        // Initialize 3D scene when page loads
        window.addEventListener('load', () => {
            setTimeout(initThreeJS, 100);
        });

        // NFC Support Check
        const nfcSupported = 'NDEFReader' in window;
        const status = document.getElementById('status');
        const alertsContainer = document.getElementById('alerts-container');

        if (nfcSupported) {
            status.className = 'status ready';
            status.textContent = '✓ NFC READY';
            
            alertsContainer.innerHTML = `
                <div class="alert info">
                    <strong>🎯 ¡Listo para usar!</strong> Presiona SCAN para leer o WRITE para escribir datos en el tag.
                </div>
            `;
        } else {
            status.className = 'status error';
            status.textContent = '✗ NO SOPORTADO';
            
            alertsContainer.innerHTML = `
                <div class="alert error">
                    <strong>⚠️ Error:</strong> Web NFC requiere Chrome en Android. Usa el navegador correcto.
                </div>
            `;

            document.getElementById('btn-scan').disabled = true;
            document.getElementById('btn-write').disabled = true;
        }

        // SCAN Function
        document.getElementById('btn-scan').addEventListener('click', async () => {
            if (!nfcSupported) return;

            try {
                const btn = document.getElementById('btn-scan');
                btn.classList.add('active');
                btn.innerHTML = '<div class="spinner"></div> Acerca el tag...';
                btn.disabled = true;

                const reader = new NDEFReader();
                await reader.scan();

                showToast('🔍 Escaneo iniciado', 'info');

                reader.onreading = ({ message, serialNumber }) => {
                    const records = [];
                    const decoder = new TextDecoder();
                    let totalSize = 0;

                    for (const record of message.records) {
                        try {
                            if (record.recordType === 'text') {
                                const text = decoder.decode(record.data);
                                records.push({ type: 'text', data: text });
                                totalSize += record.data.byteLength;
                            } else if (record.recordType === 'url') {
                                const url = decoder.decode(record.data);
                                records.push({ type: 'url', data: url });
                                totalSize += record.data.byteLength;
                            }
                        } catch (e) {
                            records.push({ type: 'unknown', data: 'Error al decodificar' });
                        }
                    }

                    // Display result with animation
                    const output = document.getElementById('read-output');
                    output.classList.add('show');
                    output.innerHTML = `
                        <div class="result-item">
                            <div class="result-label">📍 ID del Tag</div>
                            <div class="result-value">${serialNumber}</div>
                        </div>
                        ${records.length === 0 ? '<div class="result-item"><div class="result-label">⚪ Estado</div><div class="result-value">Tag vacío</div></div>' : ''}
                        ${records.map((r, idx) => `
                            <div class="result-item" style="animation-delay: ${idx * 0.1}s">
                                <div class="result-label">${r.type === 'text' ? '📝 Texto' : r.type === 'url' ? '🔗 URL' : '📦 Datos'}</div>
                                <div class="result-value">
                                    ${r.type === 'url' ? `<a href="${r.data}" target="_blank" class="result-link">${r.data}</a>` : r.data}
                                </div>
                            </div>
                        `).join('')}
                        <div class="result-item" style="animation-delay: ${records.length * 0.1}s; border-left-color: #10b981;">
                            <div class="result-label">💾 Datos Leídos</div>
                            <div class="result-value">${totalSize} bytes</div>
                        </div>
                    `;

                    // Show capacity info
                    const capacityInfo = document.getElementById('capacity-info');
                    capacityInfo.classList.add('show');
                    const estimatedCapacity = 888;
                    const available = Math.max(0, estimatedCapacity - totalSize);
                    capacityInfo.innerHTML = `
                        <strong>💾 Capacidad del Tag:</strong><br>
                        Total: ${estimatedCapacity} bytes (${(estimatedCapacity / 1024).toFixed(2)} KB)<br>
                        Usado: ${totalSize} bytes<br>
                        Disponible: ${available} bytes
                    `;

                    showToast('✅ Tag leído correctamente', 'success');
                    btn.classList.remove('active');
                    btn.innerHTML = '<span>🔍 SCAN</span>';
                    btn.disabled = false;
                };

                reader.onreadingerror = () => {
                    showToast('❌ Error al leer el tag', 'error');
                    btn.classList.remove('active');
                    btn.innerHTML = '<span>🔍 SCAN</span>';
                    btn.disabled = false;
                };
            } catch (error) {
                const btn = document.getElementById('btn-scan');
                btn.classList.remove('active');
                btn.innerHTML = '<span>🔍 SCAN</span>';
                btn.disabled = false;

                if (error.name === 'NotAllowedError') {
                    showToast('🚫 Permiso denegado. Intenta de nuevo.', 'error');
                } else if (error.name === 'SecurityError') {
                    showToast('🔒 Necesita HTTPS para funcionar.', 'error');
                } else {
                    showToast('❌ Error: ' + error.message, 'error');
                }
            }
        });

        // WRITE Function
        document.getElementById('btn-write').addEventListener('click', async () => {
            if (!nfcSupported) return;

            const content = document.getElementById('write-content').value.trim();
            const type = document.getElementById('write-type').value;

            if (!content) {
                showToast('⚠️ Ingresa contenido para escribir', 'error');
                return;
            }

            try {
                const btn = document.getElementById('btn-write');
                btn.classList.add('active');
                btn.innerHTML = '<div class="spinner"></div> Acerca el tag...';
                btn.disabled = true;

                const reader = new NDEFReader();
                const record = { recordType: type, data: content };

                await reader.write({ records: [record] });

                showToast('🎉 ¡Datos escritos correctamente!', 'success');
                document.getElementById('write-content').value = '';

                btn.classList.remove('active');
                btn.innerHTML = '<span>✨ WRITE</span>';
                btn.disabled = false;
            } catch (error) {
                const btn = document.getElementById('btn-write');
                btn.classList.remove('active');
                btn.innerHTML = '<span>✨ WRITE</span>';
                btn.disabled = false;

                if (error.name === 'NotAllowedError') {
                    showToast('🚫 Permiso denegado. Intenta de nuevo.', 'error');
                } else if (error.name === 'SecurityError') {
                    showToast('🔒 Necesita HTTPS para funcionar.', 'error');
                } else {
                    showToast('❌ Error: ' + error.message, 'error');
                }
            }
        });
    </script>
</body>
</html>
